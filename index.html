<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Noctis View</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <header>
    <span class="brand">NOCTIS VIEW</span>
    <span class="mode" id="mode">STANDBY</span>
  </header>

  <section class="viewport" aria-live="polite">

    <video
      id="feed"
      autoplay
      muted
      playsinline>
    </video>

    <div id="standby">

      <img
        id="standbyGif"
        src="IMG_1834.gif"
        alt="Noctis View standby"
      >

      <div class="camera-overlay">
        <span id="cameraName">FORWARD</span>
      </div>

    </div>

  </section>

  <nav id="cameraNav" aria-label="Camera selection">

    <button data-camera="FORWARD" class="active">
      Forward
    </button>

    <button data-camera="RIGHT">
      Right
    </button>

    <button data-camera="REAR">
      Rear
    </button>

    <button data-camera="LEFT">
      Left
    </button>

  </nav>

  <section class="controls">
    <span id="status">
      Waiting for Raspberry Pi camera feeds
    </span>
  </section>

  <footer>
    ← → camera · swipe to switch views
  </footer>

</main>

<script src="app.js"></script>

</body>
</html>
