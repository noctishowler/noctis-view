<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Noctis View</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <main id="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header>

      <span class="brand">
        NOCTIS VIEW
      </span>

      <span
        class="mode"
        id="mode"
      >
        STANDBY
      </span>

    </header>


    <!-- =========================
         MAIN CAMERA VIEW
    ========================== -->

    <section
      class="viewport"
      aria-live="polite"
    >

      <video
        id="feed"
        autoplay
        muted
        playsinline
      >
      </video>


      <div id="standby">

        <img
          id="standbyGif"
          src="IMG_1834.gif"
          alt="Noctis View standby"
        >


        <div class="camera-overlay">

          <span id="cameraName">
            FORWARD
          </span>

        </div>

      </div>

    </section>


    <!-- =========================
         CAMERA NAVIGATION
    ========================== -->

    <nav
      id="cameraNav"
      aria-label="Camera selection"
    >

      <button
        type="button"
        data-camera="FORWARD"
        class="active"
      >
        Forward
      </button>


      <button
        type="button"
        data-camera="RIGHT"
      >
        Right
      </button>


      <button
        type="button"
        data-camera="REAR"
      >
        Rear
      </button>


      <button
        type="button"
        data-camera="LEFT"
      >
        Left
      </button>

    </nav>


    <!-- =========================
         STATUS
    ========================== -->

    <section class="controls">

      <span id="status">
        Waiting for Raspberry Pi camera feeds
      </span>

    </section>


    <!-- =========================
         FOOTER / GESTURE HELP
    ========================== -->

    <footer>
      ← → camera · swipe down for tools
    </footer>


    <!-- =========================
         DIAGNOSTICS DRAWER
    ========================== -->

    <aside
      id="toolsDrawer"
      aria-hidden="true"
    >

      <div class="tools-handle"></div>


      <div class="tools-header">

        <strong>
          DIAGNOSTICS
        </strong>

        <span>
          ↑ swipe up to close
        </span>

      </div>


      <!-- Diagnostic values -->

      <div class="diag-grid">

        <div>

          <span>
            CAMERA
          </span>

          <b id="diagCamera">
            FORWARD
          </b>

        </div>


        <div>

          <span>
            MODE
          </span>

          <b id="diagMode">
            STANDBY
          </b>

        </div>


        <div>

          <span>
            FEED
          </span>

          <b id="diagFeed">
            NOT CONFIGURED
          </b>

        </div>


        <div>

          <span>
            READY
          </span>

          <b id="diagReady">
            0
          </b>

        </div>


        <div>

          <span>
            VISIBLE
          </span>

          <b id="diagVisible">
            YES
          </b>

        </div>


        <div>

          <span>
            VIEWPORT
          </span>

          <b id="diagViewport">
            --
          </b>

        </div>

      </div>


      <!-- Diagnostic actions -->

      <div class="tool-actions">

        <button
          id="toolReconnect"
          type="button"
        >
          Reconnect
        </button>


        <button
          id="toolForward"
          type="button"
        >
          Reset Forward
        </button>


        <button
          id="toolClose"
          type="button"
        >
          Close
        </button>

      </div>

    </aside>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>

</html>
