<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Noctis View</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <header>
    <span class="brand">NOCTIS VIEW</span>
    <span class="mode" id="mode">STANDBY</span>
  </header>

  <section class="viewport" aria-live="polite">

    <video
      id="feed"
      autoplay
      muted
      playsinline>
    </video>

    <div id="standby">

      <div class="scanline"></div>

      <div class="pulse-ring ring-one"></div>
      <div class="pulse-ring ring-two"></div>

      <div class="wolf">

        <div class="ear ear-left"></div>
        <div class="ear ear-right"></div>

        <div class="wolf-head">

          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>

          <div class="muzzle"></div>

        </div>

      </div>

      <div class="standby-info">

        <div class="camera-label" id="cameraName">
          FORWARD
        </div>

        <div class="standby-title">
          STANDBY
        </div>

        <div class="standby-message">
          AWAITING CAMERA FEED
        </div>

        <div class="activity">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>

    </div>

  </section>

  <nav id="cameraNav" aria-label="Camera selection">

    <button data-camera="FORWARD" class="active">
      Forward
    </button>

    <button data-camera="RIGHT">
      Right
    </button>

    <button data-camera="REAR">
      Rear
    </button>

    <button data-camera="LEFT">
      Left
    </button>

  </nav>

  <section class="controls">

    <span id="status">
      Waiting for Raspberry Pi camera feeds
    </span>

  </section>

  <footer>
    ← → camera · swipe to switch views
  </footer>

</main>

<script src="app.js"></script>

</body>
</html>
